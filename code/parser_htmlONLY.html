<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Harp Robot Controller</title>
    <script src="https://unpkg.com/@tonejs/midi"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #00ffcc; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 15px; border: 1px solid #333; max-width: 600px; margin: auto; }
        #console { background: #000; color: #0f0; text-align: left; font-family: monospace; height: 300px; overflow-y: auto; padding: 15px; border: 1px solid #444; margin-top: 20px; font-size: 13px; }
        button { padding: 10px 20px; background: #ff00ff; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin: 5px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Harmonica Robot Controller</h2>
        <input type="file" id="midi-upload" accept=".mid,.midi"><br><br>
        
        <button onclick="playMidi()">START MIDI</button>
        <button onclick="stopMidi()">STOP ALL</button>
        <button onclick="testHardware()" style="background:#555">TEST SOLENOID 1</button>
        
        <div id="status" style="margin-top:10px;">Status: Ready</div>
        <div style="background: #000; border: 2px solid #ff00ff; padding: 10px; margin-bottom: 10px; border-radius: 10px;">
            <strong style="color: #ff00ff;">LIVE COMMAND:</strong> 
            <span id="live-url" style="color: #fff; font-family: monospace; font-size: 16px;">Waiting for note...</span>
        </div>
        <div id="console">--- System Logs ---<br></div>
    </div>

<script>
// --- GLOBAL VARIABLES ---
let isPlaying = false;
let activeTimeouts = [];

// --- THE FUNCTIONS ---

function log(msg) {
    const c = document.getElementById('console');
    c.innerHTML += `<div>> ${msg}</div>`;
    c.scrollTop = c.scrollHeight;
}

// 1. TEST FUNCTION (To prove JS is alive)
function testHardware() {
    log("Manual Test: Opening Hole 1, Blow...");
    fetch("http://192.168.4.1/harp?h=1&a=1&s=0").catch(e => log("ESP32 not found, but JS is working!"));
}

// 2. PLAY FUNCTION
async function playMidi() {
    const fileInput = document.getElementById('midi-upload');
    if (!fileInput.files[0]) return alert("Select a MIDI file!");

    const reader = new FileReader();
    reader.onload = async (e) => {
        try {
            const midi = new Midi(e.target.result);
            log("SUCCESS: Parsed " + (midi.name || "Unnamed Song"));
            isPlaying = true;

            midi.tracks.forEach(track => {
                track.notes.forEach(note => {
                    let tOn = setTimeout(() => {
                        if(isPlaying) triggerHarp(note.midi, 1, note.name);
                    }, note.time * 1000);
                    
                    let tOff = setTimeout(() => {
                        if(isPlaying) triggerHarp(note.midi, 0, note.name);
                    }, (note.time + note.duration) * 1000);

                    activeTimeouts.push(tOn, tOff);
                });
            });
        } catch (err) {
            log("ERROR: Parser failed. Check internet for library.");
        }
    };
    reader.readAsArrayBuffer(fileInput.files[0]);
}

const HARP_LOGIC = {
    // Hole 1
    60: {h:1, a:1, s:0}, 61: {h:1, a:1, s:1}, // C4, C#4
    62: {h:1, a:2, s:0}, 63: {h:1, a:2, s:1}, // D4, D#4
    // Hole 2
    64: {h:2, a:1, s:0}, 65: {h:2, a:1, s:1}, // E4, F4
    65: {h:2, a:2, s:0}, 66: {h:2, a:2, s:1}, // F4, F#4 (Note: F4 can be played two ways)
    // Hole 3
    67: {h:3, a:1, s:0}, 68: {h:3, a:1, s:1}, // G4, G#4
    69: {h:3, a:2, s:0}, 70: {h:3, a:2, s:1}, // A4, A#4
    // Hole 4
    71: {h:4, a:2, s:0}, 72: {h:4, a:2, s:1}, // B4, C5
    72: {h:4, a:1, s:0}, 73: {h:4, a:1, s:1}, // C5, C#5
    // Hole 5
    72: {h:5, a:1, s:0}, 73: {h:5, a:1, s:1}, // C5, C#5 (Repeated for convenience)
    74: {h:5, a:2, s:0}, 75: {h:5, a:2, s:1}, // D5, D#5
    // Hole 6
    76: {h:6, a:1, s:0}, 77: {h:6, a:1, s:1}, // E5, F5
    77: {h:6, a:2, s:0}, 78: {h:6, a:2, s:1}, // F5, F#5
    // Hole 7
    79: {h:7, a:1, s:0}, 80: {h:7, a:1, s:1}, // G5, G#5
    81: {h:7, a:2, s:0}, 82: {h:7, a:2, s:1}, // A5, A#5
    // Hole 8
    83: {h:8, a:2, s:0}, 84: {h:8, a:2, s:1}, // B5, C6
    84: {h:8, a:1, s:0}, 85: {h:8, a:1, s:1}, // C6, C#6
    // Hole 9
    84: {h:9, a:1, s:0}, 85: {h:9, a:1, s:1}, // C6, C#6
    86: {h:9, a:2, s:0}, 87: {h:9, a:2, s:1}, // D6, D#6
    // Hole 10
    88: {h:10, a:1, s:0}, 89: {h:10, a:1, s:1}, // E6, F6
    89: {h:10, a:2, s:0}, 90: {h:10, a:2, s:1}, // F6, F#6
};

// 3. TRIGGER FUNCTION (The "Bridge" to ESP32)
function triggerHarp(midiNum, velocity, name) {
    if (!isPlaying && velocity > 0) return;

    // Look up the physical moves for this MIDI note
    // If note isn't in our map, we default to all 0s (safe)
    let data = HARP_LOGIC[midiNum] || {h: 0, a: 0, s: 0};
    
    let h = data.h;
    let a = (velocity > 0) ? data.a : 0; // Turn air off if note is ending
    let s = data.s;

    const cmd = `/harp?h=${h}&a=${a}&s=${s}`;
    
    // Update the Live Monitor
    document.getElementById('live-url').innerText = "http://192.168.4.1" + cmd;
    
    log(`${velocity > 0 ? 'ON ' : 'OFF'} | ${name} | ${cmd}`);
    fetch("http://192.168.4.1" + cmd).catch(() => {});
}

// 4. STOP FUNCTION
function stopMidi() {
    isPlaying = false;
    activeTimeouts.forEach(t => clearTimeout(t));
    activeTimeouts = [];
    fetch("http://192.168.4.1/harp?h=0&a=0&s=0").catch(() => {});
    log("SYSTEM STOPPED.");
    document.getElementById('status').innerText = "Status: Stopped";
}
</script>
</body>
</html>
